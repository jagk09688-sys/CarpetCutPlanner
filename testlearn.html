<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Room Area Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
    }
    .container {
      background: white;
      padding: 20px;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Room Area Calculator</h2>
    <input type="text" id="roomName" placeholder="Enter room name">
    <input type="number" id="length" placeholder="Enter length (m)">
    <input type="number" id="width" placeholder="Enter width (m)">
    <button onclick="calculateArea()">Calculate Area</button>
    <div id="result"></div>
  </div>

  <script>
    function calculateArea() {
      const name = document.getElementById('roomName').value;
      const length = parseFloat(document.getElementById('length').value);
      const width = parseFloat(document.getElementById('width').value);

      if (!name || isNaN(length) || isNaN(width)) {
        document.getElementById('result').innerText = "Please enter valid inputs.";
        return;
      }

      const area = length * width;
      document.getElementById('result').innerText = 
        `The area of ${name} is ${area.toFixed(2)} square meters.`;
    }
  </script>
</body>
</html>
