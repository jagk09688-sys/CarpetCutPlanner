<!DOCTYPE html>
<html lang="en">                                                                                                                                      
<head>
  <meta charset="UTF-8">
  <title>Carpet Planner</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 1.5rem; background: #f0f2f5; color: #111; }
    h1 { margin: 0 0 1.25rem; font-size: 1.5rem; color: #1e3a5f; }

    .panel {
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 1rem 1.5rem; margin-bottom: 1rem;
      display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field label { font-size: 0.75rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }
    .field input, .field select {
      padding: 0.45rem 0.6rem; border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.95rem; width: 130px;
    }
    .field input:focus, .field select:focus { outline: none; border-color: #2563eb; }

    .room {
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 1rem 1.5rem; margin-bottom: 0.75rem;
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end;
    }

    .btn {
      padding: 0.5rem 1.1rem; border: none; border-radius: 6px;
      cursor: pointer; font-size: 0.9rem; font-weight: 600; line-height: 1;
    }
    .btn-blue   { background: #2563eb; color: #fff; }
    .btn-blue:hover   { background: #1d4ed8; }
    .btn-green  { background: #16a34a; color: #fff; }
    .btn-green:hover  { background: #15803d; }
    .btn-red    { background: #dc2626; color: #fff; }
    .btn-red:hover    { background: #b91c1c; }
    .btn-grey   { background: #6b7280; color: #fff; }
    .btn-grey:hover   { background: #4b5563; }

    .controls { display: flex; gap: 0.5rem; margin: 0 0 1rem; flex-wrap: wrap; }

    /* Results */
    .result { margin-top: 1rem; }

    .room-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 0.75rem;
    }
    .room-card h3 { margin: 0 0 0.75rem; font-size: 1rem; color: #1e3a5f; }

    .stats { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .stat {
      background: #f9fafb; border-radius: 6px; padding: 0.45rem 0.75rem;
      min-width: 130px;
    }
    .stat .lbl { font-size: 0.72rem; color: #6b7280; text-transform: uppercase; font-weight: 600; }
    .stat .val { font-size: 1rem; font-weight: 700; margin-top: 0.1rem; }

    .stat.joints-0  { background: #dcfce7; }
    .stat.joints-1  { background: #fef9c3; }
    .stat.joints-2p { background: #fee2e2; }

    .info-strip {
      margin-top: 0.5rem; padding: 0.4rem 0.75rem; border-radius: 5px;
      font-size: 0.83rem; font-weight: 600;
    }
    .info-green { background: #d1fae5; color: #065f46; }
    .info-amber { background: #fef3c7; color: #92400e; }

    .summary-bar {
      background: #1e3a5f; color: #fff; border-radius: 8px;
      padding: 1.25rem 1.5rem; margin-top: 0.5rem;
      display: flex; flex-wrap: wrap; gap: 1.25rem;
    }
    .sum-stat .lbl { font-size: 0.75rem; color: #93c5fd; text-transform: uppercase; font-weight: 600; }
    .sum-stat .val { font-size: 1.3rem; font-weight: 800; margin-top: 0.1rem; }

    .offcut-note {
      margin-top: 0.75rem; padding: 0.6rem 1rem; background: #fffbeb;
      border: 1px solid #fcd34d; border-radius: 6px; font-size: 0.85rem;
    }

    .hint { font-size: 0.78rem; color: #6b7280; margin-top: 0.25rem; }

    /* ── Print ───────────────────────────────────────────────── */
    .print-only { display: none; }

    .btn-print { background: #7c3aed; color: #fff; }
    .btn-print:hover { background: #6d28d9; }

    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }

      body { background: #fff; padding: 0.5rem; font-size: 11pt; }
      h1 { font-size: 14pt; }

      /* keep coloured backgrounds when printing */
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      .summary-bar { background: #1e3a5f !important; color: #fff !important; }
      .sum-stat .lbl { color: #93c5fd !important; }
      .stat.joints-0  { background: #dcfce7 !important; }
      .stat.joints-1  { background: #fef9c3 !important; }
      .stat.joints-2p { background: #fee2e2 !important; }
      .info-green { background: #d1fae5 !important; color: #065f46 !important; }
      .info-amber { background: #fef3c7 !important; color: #92400e !important; }
      .offcut-note { background: #fffbeb !important; border-color: #fcd34d !important; }

      .room-card { break-inside: avoid; border: 1px solid #ccc !important; }

      .print-header {
        display: flex !important;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #1e3a5f;
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
      }
      .print-header h2 { margin: 0; font-size: 13pt; color: #1e3a5f; }
      .print-header .ph-meta { font-size: 9pt; color: #555; text-align: right; line-height: 1.6; }
    }
  </style>
</head>
<body>
  <h1>Carpet Planner</h1>

  <div class="panel no-print">
    <div class="field">
      <label>Customer / Job Ref</label>
      <input id="jobRef" type="text" placeholder="e.g. Smith – 12 Oak Ave" style="width:200px">
    </div>
    <div class="field">
      <label>Roll Width (m)</label>
      <input id="rollWidth" type="number" step="0.01" value="4">
    </div>
    <div class="field">
      <label>Round Up To (m)</label>
      <input id="roundTo" type="number" step="0.01" value="0.1">
    </div>
    <div class="field">
      <label>Price per m² (£)</label>
      <input id="pricePerSqm" type="number" step="0.01" value="" placeholder="e.g. 12.50">
    </div>
    <div class="field">
      <label>Fitting Cost (£)</label>
      <input id="fittingCost" type="number" step="0.01" value="" placeholder="e.g. 80.00">
    </div>
  </div>

  <div class="controls no-print">
    <button class="btn btn-blue"  onclick="addRoom()">+ Add Room</button>
    <button class="btn btn-green" onclick="calculateTotal()">Calculate</button>
    <button class="btn btn-grey"  onclick="resetOffcuts()">Reset Offcuts</button>
  </div>

  <div id="rooms" class="no-print"></div>
  <div id="output"></div>

<script>
let roomId = 0;
let rooms = [];
let offcuts = [];

function addRoom() {
  const id = roomId++;
  rooms.push({ id, name: `Room ${id + 1}`, length: 0, width: 0, orientation: 'auto' });
  renderRooms();
}

function renameRoom(id, val) {
  const r = rooms.find(r => r.id === id);
  if (r) r.name = val;
}

function removeRoom(id) {
  rooms = rooms.filter(r => r.id !== id);
  renderRooms();
}

function updateRoom(id, field, value) {
  const r = rooms.find(r => r.id === id);
  if (!r) return;
  r[field] = field === 'orientation' ? value : (parseFloat(value) || 0);
}

function renderRooms() {
  const container = document.getElementById('rooms');
  container.innerHTML = '';
  rooms.forEach(room => {
    const div = document.createElement('div');
    div.className = 'room';
    div.innerHTML = `
      <div class="field">
        <label>Room Name</label>
        <input type="text" value="${room.name}" style="width:150px"
          onchange="renameRoom(${room.id}, this.value)">
      </div>
      <div class="field">
        <label>Length (m)</label>
        <input type="number" step="0.01" value="${room.length || ''}" placeholder="e.g. 4.5"
          onchange="updateRoom(${room.id}, 'length', this.value)">
      </div>
      <div class="field">
        <label>Width (m)</label>
        <input type="number" step="0.01" value="${room.width || ''}" placeholder="e.g. 3.2"
          onchange="updateRoom(${room.id}, 'width', this.value)">
      </div>
      <div class="field">
        <label>Carpet Direction</label>
        <select onchange="updateRoom(${room.id}, 'orientation', this.value)">
          <option value="auto"   ${room.orientation === 'auto'   ? 'selected' : ''}>Auto (min joints)</option>
          <option value="length" ${room.orientation === 'length' ? 'selected' : ''}>Along Length</option>
          <option value="width"  ${room.orientation === 'width'  ? 'selected' : ''}>Along Width</option>
        </select>
        <span class="hint">Auto picks the direction with fewest seams</span>
      </div>
      <button class="btn btn-red" onclick="removeRoom(${room.id})">Remove</button>
    `;
    container.appendChild(div);
  });
}

function roundUp(val, step) {
  if (!step || step <= 0) return val;
  return Math.ceil(val / step) * step;
}

function calcRoom(room, rollWidth, roundTo, offcuts) {
  const L = room.length, W = room.width;
  if (!L || !W) return null;

  let runSide, acrossSide, orientLabel;

  // Drops needed for each possible orientation
  const dropsAlongLength = Math.ceil(W / rollWidth); // run along L, across W
  const dropsAlongWidth  = Math.ceil(L / rollWidth); // run along W, across L

  if (room.orientation === 'auto') {
    // Primary: fewest drops (fewest joints). Tie-break: shorter total roll length.
    const lenA = dropsAlongLength * L;
    const lenB = dropsAlongWidth  * W;
    if (dropsAlongLength < dropsAlongWidth || (dropsAlongLength === dropsAlongWidth && lenA <= lenB)) {
      runSide = L; acrossSide = W; orientLabel = 'along length';
    } else {
      runSide = W; acrossSide = L; orientLabel = 'along width';
    }
  } else if (room.orientation === 'length') {
    runSide = L; acrossSide = W; orientLabel = 'along length';
  } else {
    runSide = W; acrossSide = L; orientLabel = 'along width';
  }

  // --- OFFCUT REUSE ---
  for (let i = 0; i < offcuts.length; i++) {
    const strip = offcuts[i];

    // Offcut covers the entire room → no roll needed, no joints
    if (strip.width >= acrossSide && strip.length >= runSide) {
      const surplusW = strip.width - acrossSide;
      offcuts.splice(i, 1);
      // Store the leftover width of the offcut strip
      if (surplusW > 0.05) offcuts.push({ from: strip.from, width: surplusW, length: strip.length });
      const surplus = surplusW > 0.05 ? `, ${fmt(surplusW)}m surplus re-stored` : '';
      return {
        roomLen: 0, joints: 0, drops: 1,
        carpetArea: acrossSide * runSide,
        offcutUsed: `Entire room from offcut [${strip.from}]${surplus}`,
        offcutGenerated: null,
        orientLabel
      };
    }

    // Offcut covers the partial last drop
    const fullDrops   = Math.floor(acrossSide / rollWidth);
    const leftoverGap = acrossSide - fullDrops * rollWidth;
    if (leftoverGap > 0.001 && strip.width >= leftoverGap && strip.length >= runSide) {
      const surplusW = strip.width - leftoverGap;
      offcuts.splice(i, 1);
      // Store remaining width of the offcut for future rooms
      if (surplusW > 0.05) offcuts.push({ from: strip.from, width: surplusW, length: strip.length });
      const roomLen = roundUp(fullDrops * runSide, roundTo);
      const carpetArea = fullDrops * rollWidth * runSide + leftoverGap * runSide;
      const surplus = surplusW > 0.05 ? `, ${fmt(surplusW)}m surplus re-stored` : '';
      return {
        roomLen, joints: fullDrops, drops: fullDrops + 1,
        carpetArea,
        offcutUsed: `Last drop (${fmt(leftoverGap)}m) from offcut [${strip.from}]${surplus}`,
        offcutGenerated: null,
        orientLabel
      };
    }
  }
  // --- END REUSE ---

  const totalDrops = Math.ceil(acrossSide / rollWidth);
  const joints = totalDrops - 1;
  const leftoverW = totalDrops * rollWidth - acrossSide;
  const roomLen = roundUp(totalDrops * runSide, roundTo);
  const carpetArea = roomLen * rollWidth;

  let offcutGenerated = null;
  if (leftoverW > 0.05) {
    offcutGenerated = { from: room.name, width: leftoverW, length: runSide };
    offcuts.push(offcutGenerated);
  }

  return { roomLen, joints, drops: totalDrops, carpetArea, offcutUsed: null, offcutGenerated, orientLabel };
}

function fmt(n) { return n.toFixed(2); }
function fmtGBP(n) { return '£' + n.toFixed(2); }

function calculateTotal() {
  offcuts = []; // always start fresh — prevents duplicate offcuts on recalculate

  const rollWidth   = parseFloat(document.getElementById('rollWidth').value)   || 4;
  const roundTo     = parseFloat(document.getElementById('roundTo').value)     || 0.1;
  const pricePerSqm = parseFloat(document.getElementById('pricePerSqm').value) || 0;
  const fittingCost = parseFloat(document.getElementById('fittingCost').value) || 0;
  const pricePerLinM = pricePerSqm * rollWidth;

  let totalLen    = 0;
  let totalJoints = 0;
  let totalRoomArea = 0;
  let html = '';

  rooms.forEach(room => {
    const res = calcRoom(room, rollWidth, roundTo, offcuts);
    if (!res) {
      html += `<div class="room-card"><h3>${room.name}</h3><p style="color:#999">Enter room dimensions to calculate.</p></div>`;
      return;
    }

    totalLen    += res.roomLen;
    totalJoints += res.joints;

    const roomArea   = room.length * room.width;
    totalRoomArea   += roomArea;
    const carpetArea  = res.carpetArea;                       // actual carpet used (roll + offcut)
    const wasteArea   = Math.max(0, carpetArea - roomArea);   // never show negative
    const roomCost    = res.roomLen * pricePerLinM;

    const jointsClass = res.joints === 0 ? 'joints-0' : res.joints === 1 ? 'joints-1' : 'joints-2p';
    const jointsLabel = res.joints === 0 ? '0 — seamless' : res.joints;

    html += `
      <div class="room-card">
        <h3>${room.name} &mdash; ${fmt(room.length)} &times; ${fmt(room.width)} m</h3>
        <div class="stats">
          <div class="stat ${jointsClass}">
            <div class="lbl">Joints / Seams</div>
            <div class="val">${jointsLabel}</div>
          </div>
          <div class="stat">
            <div class="lbl">Drops</div>
            <div class="val">${res.drops}</div>
          </div>
          <div class="stat">
            <div class="lbl">Direction</div>
            <div class="val">${res.orientLabel}</div>
          </div>
          <div class="stat">
            <div class="lbl">Roll Length Used</div>
            <div class="val">${fmt(res.roomLen)} m</div>
          </div>
          <div class="stat">
            <div class="lbl">Floor Area</div>
            <div class="val">${fmt(roomArea)} m²</div>
          </div>
          <div class="stat">
            <div class="lbl">Carpet Cut Area</div>
            <div class="val">${fmt(carpetArea)} m²</div>
          </div>
          <div class="stat">
            <div class="lbl">Offcut Waste</div>
            <div class="val">${fmt(wasteArea)} m²</div>
          </div>
          ${pricePerSqm > 0 ? `
          <div class="stat">
            <div class="lbl">Room Carpet Cost</div>
            <div class="val">${fmtGBP(roomCost)}</div>
          </div>` : ''}
        </div>
        ${res.offcutUsed       ? `<div class="info-strip info-green">\u2713 Offcut reused: ${res.offcutUsed}</div>` : ''}
        ${res.offcutGenerated  ? `<div class="info-strip info-amber">\u2713 Offcut stored (${fmt(res.offcutGenerated.width)}&times;${fmt(res.offcutGenerated.length)} m) — available for later rooms</div>` : ''}
      </div>`;
  });

  const totalCarpetCost = totalLen * pricePerLinM;
  const grandTotal = totalCarpetCost + fittingCost;
  const totalCarpetArea = totalLen * rollWidth;

  let summaryHtml = `
    <div class="summary-bar">
      <div class="sum-stat">
        <div class="lbl">Total Roll Length</div>
        <div class="val">${fmt(totalLen)} m</div>
      </div>
      <div class="sum-stat">
        <div class="lbl">Total Floor Area</div>
        <div class="val">${fmt(totalRoomArea)} m²</div>
      </div>
      <div class="sum-stat">
        <div class="lbl">Carpet Area Bought</div>
        <div class="val">${fmt(totalCarpetArea)} m²</div>
      </div>
      <div class="sum-stat">
        <div class="lbl">Total Joints</div>
        <div class="val">${totalJoints}</div>
      </div>`;

  if (pricePerSqm > 0) {
    summaryHtml += `
      <div class="sum-stat">
        <div class="lbl">Carpet Material</div>
        <div class="val">${fmtGBP(totalCarpetCost)}</div>
      </div>`;
    if (fittingCost > 0) {
      summaryHtml += `
        <div class="sum-stat">
          <div class="lbl">Fitting</div>
          <div class="val">${fmtGBP(fittingCost)}</div>
        </div>
        <div class="sum-stat">
          <div class="lbl">Total (inc. fitting)</div>
          <div class="val">${fmtGBP(grandTotal)}</div>
        </div>`;
    }
    const pricePerSqmEffective = grandTotal / totalRoomArea || 0;
    summaryHtml += `
      <div class="sum-stat">
        <div class="lbl">Effective Price / m²</div>
        <div class="val">${fmtGBP(totalRoomArea > 0 ? grandTotal / totalRoomArea : 0)}</div>
      </div>`;
  }

  summaryHtml += `</div>`;

  let offcutNote = '';
  if (offcuts.length) {
    offcutNote = `<div class="offcut-note"><strong>Stored offcuts (${offcuts.length}):</strong> ` +
      offcuts.map(o => `${o.from}: ${fmt(o.width)}&times;${fmt(o.length)} m`).join(' &nbsp;|&nbsp; ') +
      '</div>';
  }

  const jobRef     = document.getElementById('jobRef').value.trim();
  const printDate  = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });

  const printHeader = `
    <div class="print-only print-header">
      <div>
        <h2>Carpet Installation Plan</h2>
        ${jobRef ? `<div style="font-size:10pt;color:#555;margin-top:0.2rem">${jobRef}</div>` : ''}
      </div>
      <div class="ph-meta">
        Date: ${printDate}<br>
        Roll width: ${rollWidth} m<br>
        ${pricePerSqm > 0 ? `Price: £${pricePerSqm.toFixed(2)}/m²<br>` : ''}
        ${fittingCost > 0 ? `Fitting: £${fittingCost.toFixed(2)}<br>` : ''}
        Generated by Carpet Planner
      </div>
    </div>`;

  const printBtn = `
    <div class="no-print" style="margin-top:0.75rem">
      <button class="btn btn-print" onclick="window.print()">&#128438; Print / Save PDF</button>
    </div>`;

  document.getElementById('output').innerHTML =
    `<div class="result">${printHeader}${html}${summaryHtml}${offcutNote}${printBtn}</div>`;
}

function resetOffcuts() {
  offcuts = [];
  document.getElementById('output').innerHTML =
    '<div class="result"><p style="color:#6b7280">Offcuts cleared. Click Calculate to refresh.</p></div>';
}

addRoom();
</script>
</body>
</html>
