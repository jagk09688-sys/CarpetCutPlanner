<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carpet Planner</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 24px;
    }
    .wrap { max-width: 900px; margin: auto; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 12px; margin-bottom: 4px; color: #94a3b8; }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #e5e7eb;
    }
    .row {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }
    .btns { display: flex; gap: 10px; margin-top: 10px; }
    button {
      background: #38bdf8;
      color: #001226;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: transparent;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }
    .result { margin-top: 10px; font-size: 14px; }
    .tag { background: #052e1a; color: #22c55e; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-right: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; border-bottom: 1px solid #1f2937; font-size: 14px; text-align: left; }
    th { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Carpet Planner</h1>
    <div class="card">
      <label>Roll width (m)</label>
      <input type="number" id="rollWidth" step="0.01" value="3.66" />
      <label>Priority</label>
      <select id="priority">
        <option value="seams">Minimize seams</option>
        <option value="waste">Minimize waste</option>
      </select>
    </div>

    <div class="card" id="roomContainer"></div>

    <div class="btns">
      <button onclick="addRoom()">Add Room</button>
      <button onclick="calculate()">Calculate</button>
    </div>

    <div id="output" class="card"></div>
  </div>

  <script>
    let roomCount = 0;

    function addRoom(length = '', width = '') {
      roomCount++;
      const container = document.getElementById('roomContainer');
      container.insertAdjacentHTML('beforeend', `
        <div class="row" id="room${roomCount}">
          <div><strong>Room ${roomCount}</strong></div>
          <div>
            <label>Length (m)</label>
            <input type="number" step="0.01" value="${length}" id="l${roomCount}" />
          </div>
          <div>
            <label>Width (m)</label>
            <input type="number" step="0.01" value="${width}" id="w${roomCount}" />
          </div>
          <div>
            <button class="secondary" onclick="removeRoom(${roomCount})">Remove</button>
          </div>
        </div>
      `);
    }

    function removeRoom(id) {
      const room = document.getElementById(`room${id}`);
      if (room) room.remove();
    }

    function calculate() {
      const rollW = parseFloat(document.getElementById('rollWidth').value || '3.66');
      const priority = document.getElementById('priority').value;
      let totalLM = 0, totalSeams = 0, totalExcess = 0;
      let html = "";

      for (let i = 1; i <= roomCount; i++) {
        const l = document.getElementById(`l${i}`);
        const w = document.getElementById(`w${i}`);
        if (!l || !w) continue;
        const L = parseFloat(l.value), W = parseFloat(w.value);

        const stripsA = Math.ceil(W / rollW);
        const lmA = stripsA * L;
        const seamsA = Math.max(0, stripsA - 1);
        const excessA = stripsA * rollW - W;

        const stripsB = Math.ceil(L / rollW);
        const lmB = stripsB * W;
        const seamsB = Math.max(0, stripsB - 1);
        const excessB = stripsB * rollW - L;

        let pick = { orientation: "Length", strips: stripsA, seams: seamsA, lm: lmA, excess: excessA };
        let alt = { orientation: "Width", strips: stripsB, seams: seamsB, lm: lmB, excess: excessB };

        if (priority === "seams") {
          if (seamsB < seamsA || (seamsB === seamsA && lmB < lmA) || (seamsB === seamsA && lmB === lmA && excessB < excessA)) {
            [pick, alt] = [alt, pick];
          }
        } else {
          if (lmB < lmA || (lmB === lmA && seamsB < seamsA) || (lmB === lmA && seamsB === seamsA && excessB < excessA)) {
            [pick, alt] = [alt, pick];
          }
        }

        totalLM += pick.lm;
        totalSeams += pick.seams;
        totalExcess += pick.excess;

        html += `
          <div class="result">
            <span class="tag">Recommended</span>
            Room ${i}: Strips along ${pick.orientation} — strips: ${pick.strips}, seams: ${pick.seams}, linear meters: ${pick.lm.toFixed(2)}, excess: ${pick.excess.toFixed(2)} m
            <div style="color:#94a3b8; font-size:12px;">Alternative: Strips along ${alt.orientation} — strips: ${alt.strips}, seams: ${alt.seams}, linear meters: ${alt.lm.toFixed(2)}, excess: ${alt.excess.toFixed(2)} m</div>
          </div>
        `;
      }

      html += `
        <table>
          <tr><th>Total linear meters</th><th>Total seams</th><th>Total excess (m)</th></tr>
          <tr><td>${totalLM.toFixed(2)}</td><td>${totalSeams}</td><td>${totalExcess.toFixed(2)}</td></tr>
        </table>
      `;

      document.getElementById('output').innerHTML = html;
    }

    // Add default test room
    window.onload = () => {
      addRoom(5.48, 4.08); // Your expert's test case
    };
  </script>
</body>
</html>
